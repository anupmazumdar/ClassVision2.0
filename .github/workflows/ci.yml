name: ClassVision 2.0 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        working-directory: backend
        env:
          ENVIRONMENT: testing
          JWT_SECRET: test_jwt_secret_min_32_characters_long_123456
          SESSION_CODE_SECRET: test_session_code_secret_min_32_characters_long_123456
          ATTENDANCE_TICKET_SECRET: test_attendance_ticket_secret_min_32_chars_123456
          FACE_ENCRYPTION_KEY: E9SSVPs9LfUYGdJv6CkE6xOyopZmKxAWHoFZPgXT7Sc=
        run: |
          pytest test_priority1.py test_priority2.py tests/ -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
