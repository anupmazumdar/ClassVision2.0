services:
  - type: web
    name: classvision-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://classvission.anupmazumdar.me,http://localhost:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_CODE_SECRET
        generateValue: true
      - key: ATTENDANCE_TICKET_SECRET
        generateValue: true
      - key: FACE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_NAME
        value: Super Admin
      - key: ADMIN_EMAIL
        value: admin@classvision.local
      - key: ADMIN_PASSWORD
        generateValue: true
